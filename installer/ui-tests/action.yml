name: Prepare installer UI tests
description: Configure the Windows runner for the Git Bash and Git CMD checklist
runs:
  using: composite
  steps:
    - name: Install AutoHotkey and configure MinTTY
      shell: bash
      run: |
        curl -fLo "$RUNNER_TEMP/ahk.zip" \
          https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31.zip &&
        mkdir -p "$RUNNER_TEMP/ahk" &&
        "$WINDIR/system32/tar.exe" -C "$RUNNER_TEMP/ahk" -xf "$RUNNER_TEMP/ahk.zip" &&
        cygpath -aw "$RUNNER_TEMP/ahk" >>"$GITHUB_PATH" &&
        printf '%s\n' \
          'KeyFunctions=C+F5:export-html' \
          'SaveFilename=/tmp/mintty-export' \
          >>~/.minttyrc
    - name: Set up Windows Terminal
      shell: pwsh
      run: |
        # On windows-11-arm, Windows Terminal is installed but not
        # registered for the runner user, so cmd.exe opens in conhost.
        if (-not (Get-AppxPackage Microsoft.WindowsTerminal)) {
          $p = Get-AppxPackage -AllUsers Microsoft.WindowsTerminal
          Add-AppxPackage -Register "$($p.InstallLocation)\AppxManifest.xml" -DisableDevelopmentMode
        }
        $dir = "$env:LOCALAPPDATA\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState"
        New-Item -ItemType Directory -Force $dir | Out-Null
        $exportFile = "$env:RUNNER_TEMP/wt-export.txt" -replace '\\', '/'
        Set-Content "$dir\settings.json" @"
        {
          "profiles": { "defaults": { "font": { "face": "Cascadia Mono", "size": 12 } } },
          "actions": [ { "command": { "action": "exportBuffer", "path": "$exportFile" }, "id": "User.exportBuffer" } ],
          "keybindings": [ { "keys": "ctrl+shift+f12", "id": "User.exportBuffer" } ]
        }
        "@
    - name: Block WSL so its prompt does not interfere with UI tests
      shell: pwsh
      run: |
        # On windows-11-arm, the runner can launch wsl.exe at random
        # times, covering the windows under test with its install prompt.
        $ifeo = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\wsl.exe'
        New-Item -Force $ifeo | Out-Null
        Set-ItemProperty $ifeo Debugger "$env:SystemRoot\System32\systray.exe"
        Stop-Process -Name wsl -Force -ErrorAction SilentlyContinue
    - name: Minimize windows
      shell: pwsh
      env:
        UI_TEST_SETUP_DIR: ${{ github.action_path }}
      run: |
        # Give the search indexer time to index the newly installed shortcuts.
        Start-Sleep 10
        & AutoHotkey64.exe /ErrorStdOut /force `
          "$env:UI_TEST_SETUP_DIR\minimize-windows.ahk" 2>&1 | Out-Default
